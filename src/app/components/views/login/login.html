<div class="login-container d-flex align-items-center justify-content-center">
  <div class="card login-card shadow-lg border-0 p-4">
    <div class="text-center mb-4">
      <h2 class="fw-bold mb-1">HabitApp</h2>
      <p class="text-muted small mb-0">Transforme a sua rotina diária</p>
    </div>

    <div class="d-flex border-bottom mb-4">
      <button
        type="button"
        class="flex-grow-1 border-0 bg-transparent pb-2 fw-semibold text-center tab-btn"
        [class.active]="isLoginMode"
        (click)="toggleMode(true)"
      >
        Entrar
      </button>
      <button
        type="button"
        class="flex-grow-1 border-0 bg-transparent pb-2 fw-semibold text-center tab-btn"
        [class.active]="!isLoginMode"
        (click)="toggleMode(false)"
      >
        Criar Conta
      </button>
    </div>

    <form (ngSubmit)="onSubmit()" #authForm="ngForm">
      @if (!isLoginMode) {
        <div class="mb-3">
          <label class="form-label small fw-semibold text-muted">Nome Completo</label>
          <input
            type="text"
            class="form-control theme-input w-100"
            placeholder="Seu nome"
            [(ngModel)]="formData.name"
            name="name"
            required
          />
        </div>
      }

      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted">E-mail</label>
        <input
          type="email"
          class="form-control theme-input w-100"
          placeholder="exemplo@email.com"
          [(ngModel)]="formData.email"
          name="email"
          required
          email
        />
      </div>

      <div class="mb-4">
        <label class="form-label small fw-semibold text-muted">Senha</label>
        <input
          type="password"
          class="form-control theme-input w-100"
          placeholder="••••••••"
          [(ngModel)]="formData.password"
          name="password"
          required
        />
      </div>

      <button
        type="submit"
        class="btn btn-habit-primary w-100 py-2.5 fw-semibold shadow-sm text-white"
        [disabled]="authForm.invalid || (isLoading$ | async)"
      >
        @if (isLoading$ | async) {
          <span class="spinner-border spinner-border-sm me-2" role="status"></span>
          Processando...
        } @else {
          {{ isLoginMode ? 'Entrar' : 'Criar Conta' }}
        }
      </button>
    </form>
  </div>
</div>
