@let resolvedTheme = resolvedTheme$ | async;

@if (isLoggedIn$ | async; as user) {
  <header class="header-container sticky-top">
    <div class="container header-inner">
      <div class="brand-lockup" aria-label="HabitApp">
        <span class="brand-mark" aria-hidden="true">
          <img src="app-logo.svg" alt="" class="brand-logo" />
        </span>
        <span class="brand-copy">
          <span class="brand-kicker">HabitApp</span>
          <span class="header-title">Habits</span>
        </span>
      </div>

      <div class="header-actions">
        <div class="profile-container">
          <span class="user-name">{{ user.name }}</span>
          <button
            type="button"
            class="btn-avatar"
            [matMenuTriggerFor]="profileMenu"
            [attr.aria-label]="'Open profile menu for ' + user.name"
          >
            <span class="profile-avatar__initial" aria-hidden="true">{{
              user.name.charAt(0) | uppercase
            }}</span>
            <span class="material-icons profile-avatar__chevron" aria-hidden="true"
              >expand_more</span
            >
          </button>
        </div>

        <mat-menu
          #profileMenu="matMenu"
          xPosition="before"
          yPosition="below"
          class="custom-profile-menu"
        >
          <button mat-menu-item (click)="openEditUserDialog(user)">
            <span class="material-icons menu-icon" aria-hidden="true">manage_accounts</span>
            <span>Update Profile</span>
          </button>
          <button mat-menu-item class="menu-danger" (click)="logout()">
            <span class="material-icons menu-icon" aria-hidden="true">logout</span>
            <span>Sign Out</span>
          </button>
        </mat-menu>
        <button
          type="button"
          class="theme-toggle"
          (click)="toggleTheme()"
          [attr.aria-label]="resolvedTheme === 'dark' ? 'Use light theme' : 'Use dark theme'"
          [attr.aria-pressed]="resolvedTheme === 'dark'"
        >
          <span class="material-icons theme-toggle__icon" aria-hidden="true">
            {{ resolvedTheme === 'dark' ? 'dark_mode' : 'light_mode' }}
          </span>
        </button>
      </div>
    </div>
  </header>
}
