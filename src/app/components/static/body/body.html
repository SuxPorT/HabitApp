<div class="container body-wrapper">
  <section class="row week-summary rounded shadow-sm mb-4 mx-0">
    <div *ngFor="let day of weekDays; let i = index" class="col text-center">
      <small class="text-muted d-block mb-1">{{ day }}</small>
      <div class="day-indicator mx-auto" [class.active]="i === 3"></div>
    </div>
  </section>

  <div class="d-flex justify-content-end mb-4">
    <button (click)="openNewHabitDialog()" class="btn btn-habit-primary shadow-sm">
      + Novo Hábito
    </button>
  </div>

  <main class="row g-3">
    <div *ngFor="let habit of habits" class="col-12">
      <div class="card habit-card border-0 shadow-sm">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center">
            <div class="habit-icon-wrapper me-3">{{ habit.icon }}</div>
            <div>
              <h3 class="habit-name mb-1 fw-bold">{{ habit.title }}</h3>
              <p class="small text-muted mb-0">{{ habit.streak }} dias seguidos</p>
            </div>
          </div>

          <div class="d-flex align-items-center gap-3">
            <div class="d-flex gap-2 border-end pe-3">
              <button
                *ngFor="let done of habit.completedDays; let j = index"
                (click)="toggleHabit(habit.id, j)"
                class="status-dot"
                [class.completed]="done"
              ></button>
            </div>

            <div class="action-buttons d-flex gap-1">
              <button
                class="btn btn-action edit"
                (click)="openNewHabitDialog(habit)"
                title="Editar"
              >
                ✏️
              </button>
              <button class="btn btn-action delete" (click)="deleteHabit(habit.id)" title="Excluir">
                🗑️
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
