<div class="dashboard-container">
  <header class="header">
    <h1>Meus Hábitos</h1>
    <button class="btn-add">+ Novo Hábito</button>
  </header>

  <section class="week-overview">
    <div *ngFor="let day of weekDays; let i = index" class="day-column">
      <span class="day-label">{{ day }}</span>
      <div class="day-dot" [class.active]="i === 3"></div>
    </div>
  </section>

  <main class="habit-list">
    <div *ngFor="let habit of habits" class="habit-card">
      <div class="habit-info">
        <span class="habit-icon">{{ habit.icon }}</span>
        <div>
          <h3>{{ habit.title }}</h3>
          <p>{{ habit.streak }} dias seguidos</p>
        </div>
      </div>

      <div class="habit-week-status">
        <button
          *ngFor="let done of habit.completedDays; let j = index"
          class="status-circle"
          [class.completed]="done"
          (click)="toggleHabit(habit.id, j)"
        ></button>
      </div>
    </div>
  </main>
</div>

<footer class="app-footer">
  <div class="footer-content">
    <p>&copy; 2026 HabitApp. Transformando rotinas.</p>

    <div class="footer-links">
      <a href="#">Privacidade</a>
      <a href="#">Suporte</a>
    </div>
  </div>
</footer>
